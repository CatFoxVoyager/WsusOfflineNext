name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  node-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [generator, installer]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-modern/${{ matrix.app }}/package-lock.json

      - name: Build ${{ matrix.app }} (tsc + vite)
        working-directory: src-modern/${{ matrix.app }}
        run: |
          npm ci
          npm run build

  # fixture-tests is the third job — the 2026-10-28 design
  # (docs/superpowers/specs/2026-10-28-ci-cd-dependencies-updates-design.md)
  # planned two jobs (node-build, dotnet-build); this one is additive.
  # It is load-bearing, not drift: it runs the ci/tests fixture suite on every
  # pull_request and is the only job that catches ci-script regressions.
  # Finding CR-02 of the 2026-10-29 CI/CD code review proved this job red on a
  # clean checkout before the mkdir fix — exactly the class of rupture it
  # exists to surface. Keep it.
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link validator and list fusion fixtures
        run: |
          bash ci/tests/test-validate-links.sh
          bash ci/tests/test-regen-static-lists.sh
          bash ci/tests/test-bump-version.sh
          bash ci/tests/test-fetch-release-helpers.sh
          bash ci/tests/test-runner-entrypoint.sh

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish generator host (win-x64 sanity)
        run: >
          dotnet publish src-modern/generator/host/UpdateGenerator.csproj
          -c Release -r win-x64
          /p:EnableWindowsTargeting=true
          /p:PublishSingleFile=true /p:SelfContained=false
          -o ci-out

      - name: Publish installer host (win-x64 sanity)
        run: >
          dotnet publish src-modern/installer/host/UpdateInstaller.csproj
          -c Release -r win-x64
          /p:EnableWindowsTargeting=true
          /p:PublishSingleFile=true /p:SelfContained=false
          -o ci-out/installer
