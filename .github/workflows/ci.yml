name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  node-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [generator, installer]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-modern/${{ matrix.app }}/package-lock.json

      - name: Build ${{ matrix.app }} (tsc + vite)
        working-directory: src-modern/${{ matrix.app }}
        run: |
          npm ci
          npm run build

  # fixture-tests is the third job — the 2026-10-28 design
  # (docs/superpowers/specs/2026-10-28-ci-cd-dependencies-updates-design.md)
  # planned two jobs (node-build, dotnet-build); this one is additive.
  # It is load-bearing, not drift: it runs the ci/tests fixture suite on every
  # pull_request and is the only job that catches ci-script regressions.
  # Finding CR-02 of the 2026-10-29 CI/CD code review proved this job red on a
  # clean checkout before the mkdir fix — exactly the class of rupture it
  # exists to surface. Keep it.
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link validator and list fusion fixtures
        run: |
          bash ci/tests/test-validate-links.sh
          bash ci/tests/test-regen-static-lists.sh
          bash ci/tests/test-bump-version.sh
          bash ci/tests/test-compare-versions.sh
          bash ci/tests/test-fetch-release-helpers.sh
          bash ci/tests/test-runner-entrypoint.sh
          bash ci/tests/test-bump-webview2-dep.sh
          bash ci/tests/test-webview2-version-gate.sh

  # Closes deferred item 20-01: the repo bash gate (bash -n + shellcheck over the repo bash surface) runs on every clean checkout.
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax gate (bash -n + shellcheck)
        run: bash sh/syntax-check.bash

  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src-modern/generator/package-lock.json
            src-modern/installer/package-lock.json

      - name: Build generator frontend
        working-directory: src-modern/generator
        run: |
          npm ci
          npm run build

      - name: Build installer frontend
        working-directory: src-modern/installer
        run: |
          npm ci
          npm run build

      # DEPS-07 : un glob vide n'est pas une erreur MSBuild — refuser un embed vide avant tout publish.
      - name: Fail-closed on empty dist
        run: |
          ok=1
          test -f src-modern/generator/dist/index.html || { echo "::error::generator dist vide ou incomplet (index.html manquant)"; ok=0; }
          test -f src-modern/installer/dist/index.html || { echo "::error::installer dist vide ou incomplet (index.html manquant)"; ok=0; }
          ls src-modern/generator/dist/assets/*.js >/dev/null 2>&1 || { echo "::error::generator dist sans asset JS"; ok=0; }
          ls src-modern/installer/dist/assets/*.js >/dev/null 2>&1 || { echo "::error::installer dist sans asset JS"; ok=0; }
          [ "$ok" -eq 1 ] || exit 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish generator host (win-x64 sanity)
        run: >
          dotnet publish src-modern/generator/host/UpdateGenerator.csproj
          -c Release -r win-x64
          /p:EnableWindowsTargeting=true
          /p:PublishSingleFile=true /p:SelfContained=false
          -o ci-out

      - name: Publish installer host (win-x64 sanity)
        run: >
          dotnet publish src-modern/installer/host/UpdateInstaller.csproj
          -c Release -r win-x64
          /p:EnableWindowsTargeting=true
          /p:PublishSingleFile=true /p:SelfContained=false
          -o ci-out/installer
