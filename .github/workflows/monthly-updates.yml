              if pefile is None:
                  strings_lines.append(exe + "|<pefile unavailable - StringFileInfo not quoted>")
                  continue
              pe = pefile.PE(exe)
              found = False
              for fileinfo in pe.FileInfo or []:
                  for entry in fileinfo:
                      if entry.Key == b"StringFileInfo":
                          for st in entry.StringTable:
                              for k, v in st.entries.items():
                                  strings_lines.append(f"{exe}|{k.decode('utf-8', 'replace')}={v.decode('utf-8', 'replace')}")
                                  found = True
              if not found:
                  strings_lines.append(exe + "|<no StringFileInfo found>")

          (packet / "stringfileinfo.txt").write_text("\n".join(strings_lines) + "\n", encoding="utf-8")

          head = [
              "# WDSI submission notes - {arch} packet (generated by the FP-reputation gate)",
              "",
              "Binaries covered by this packet:",
              "",
          ]
          for arch, exes in ARCH.items():
              lines = [line.replace("{arch}", arch) for line in head]
