name: Monthly updates

# Monthly catalog refresh + release (design: docs/superpowers/specs/2026-10-28-ci-cd-dependencies-updates-design.md)
#
# SECURITY: the release job runs on the SELF-HOSTED Windows runner (the
# maintainer's machine); the catalog job runs on the self-hosted Docker Linux
# runner. Neither may ever execute for pull_request events, and only for this
# repository — the guards below are load-bearing, do not relax them.
# dry_run (workflow_dispatch only) forbids every push, tag and release.
# Scheduled runs pass no inputs, so dry_run defaults to false there.
# WR-03: the catalog job checks out main explicitly, so a workflow_dispatch
# from any ref refreshes and pushes main content only - never a feature branch.

on:
  schedule:
    - cron: '0 6 15 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only: no push, no tag, no release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: wson-monthly
  cancel-in-progress: false

jobs:
  catalog:
    name: Catalog refresh (Docker Linux)
    runs-on: [self-hosted, wson-docker]
    timeout-minutes: 90
    if: github.event_name != 'pull_request' && github.repository == 'CatFoxVoyager/WsusOfflineNext'
    outputs:
      fire: ${{ steps.decide.outputs.fire }}
      lists_changed: ${{ steps.decide.outputs.lists_changed }}
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Download catalog and extract id/url pairs (Linux toolchain)
        run: bash ci/extract-catalog-linux.bash "$RUNNER_TEMP/catalog" --download

      - name: Validate static links (two-pass, cache persisted between runs)
        run: bash ci/validate-links.bash static "$RUNNER_TEMP/pre.md" "$RUNNER_TEMP/dead.md" --cache "$GITHUB_WORKSPACE/../wson-dead-cache.txt"

      - name: Regenerate static lists (real fusion unless dry run)
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            bash ci/regen-static-lists.bash "$RUNNER_TEMP/catalog" static "$RUNNER_TEMP/dead.md" --dry-run
          else
            bash ci/regen-static-lists.bash "$RUNNER_TEMP/catalog" static "$RUNNER_TEMP/dead.md"
            mv .regen-report.md "$RUNNER_TEMP/regen-report.md"
          fi

      - name: Upload regeneration report
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regen-report
          path: ${{ runner.temp }}/regen-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Control build (stands in for CI on token commits)
        run: |
          cd src-modern/generator && npm ci && npm run build && cd ../..
          cd src-modern/installer && npm ci && npm run build && cd ../..

      - name: Decide
        id: decide
        run: |
          if git diff --quiet -- static/; then
            lists_changed=false
          else
            lists_changed=true
          fi
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "$last_tag" = "none" ]; then
            commits_since=1
          else
            commits_since="$(git rev-list --count "${last_tag}..HEAD")"
          fi
          fire=false
          if [ "$lists_changed" = true ] || [ "$commits_since" -gt 0 ]; then
            fire=true
          fi
          {
            echo "fire=$fire"
            echo "lists_changed=$lists_changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Monthly updates report"
            echo
            echo "- lists changed: $lists_changed"
            echo "- commits since $last_tag: $commits_since"
            echo "- release fired: $fire"
            echo "- dry run: $DRY_RUN"
            echo
            echo '### Link validation (before)'
            echo '```'
            cat "$RUNNER_TEMP/pre.md"
            echo '```'
            echo
            echo '### Regeneration report'
            echo '```'
            cat "$RUNNER_TEMP/regen-report.md" 2>/dev/null || echo "(dry run — no fusion applied)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "decide: lists_changed=$lists_changed fire=$fire commits_since=$commits_since dry_run=$DRY_RUN"

      - name: Commit refreshed lists
        if: steps.decide.outputs.lists_changed == 'true' && env.DRY_RUN != 'true'
        run: |
          git add static/
          git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "chore(static): refresh download links $(date -u +%Y-%m)"
          git fetch -q origin main
          git merge-base --is-ancestor FETCH_HEAD HEAD \
            || { echo "REFUS: main a avance pendant le run - push non fast-forward evite; relancer le train mensuel" >&2; exit 1; }
          git push origin HEAD:main

      - name: Dry-run boundary (catalog)
        if: env.DRY_RUN == 'true'
        run: echo "DRY RUN — no commit was pushed."

  release:
    name: Build and release (Windows native)
    needs: catalog
    runs-on: [self-hosted, wson-windows]
    timeout-minutes: 90
    if: |
      needs.catalog.result == 'success' &&
      needs.catalog.outputs.fire == 'true' &&
      github.event_name != 'pull_request' &&
      github.repository == 'CatFoxVoyager/WsusOfflineNext' &&
      inputs.dry_run != true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (includes the refreshed lists)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Download regeneration report
        uses: actions/download-artifact@v4
        with:
          name: regen-report
          path: ${{ runner.temp }}

      - name: Resolve next version
        id: version
        run: |
          base="$(date -u +%Y.%m)"
          patch=0
          while git rev-parse -q --verify "refs/tags/v${base}.${patch}" >/dev/null; do
            patch=$((patch + 1))
          done
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "version: ${base}.${patch}"

      - name: Bump version
        run: |
          bash ci/bump-version.bash "${{ steps.version.outputs.version }}"
          git add cmd/DownloadUpdates.cmd client/cmd/DoUpdate.cmd \
            client/UpdateInstaller.au3 client/UpdateInstallerLauncher.au3 \
            UpdateGenerator.au3 UpdateGeneratorLauncher.au3 \
            CompileModernApps.cmd README.md \
            sh/download-updates.bash sh/update-generator.bash \
            src-modern/generator/host/UpdateGenerator.csproj src-modern/installer/host/UpdateInstaller.csproj \
            src-modern/generator/package.json src-modern/installer/package.json \
            src-modern/generator/src/App.tsx src-modern/installer/src/App.tsx \
            static/SelfUpdateVersion-this.txt
          git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "chore(release): bump version to ${{ steps.version.outputs.version }}"

      - name: Append release notes
        run: |
          VER="${{ steps.version.outputs.version }}"
          REPORT="${RUNNER_TEMP}/regen-report.md"
          [ -s "${REPORT}" ] || { echo "FAIL: rapport regen absent (transfert artifact manquant)"; exit 1; }
          ADDED="$(grep -oE '[0-9]+ added' "${REPORT}" | head -1 | cut -d' ' -f1)"
          REMOVED="$(grep -oE '[0-9]+ removed' "${REPORT}" | head -1 | cut -d' ' -f1)"
          ADDED="${ADDED:-0}"; REMOVED="${REMOVED:-0}"
          {
            echo ""
            echo "## ${VER}"
            echo ""
            echo "**Status:** current release."
            echo ""
            echo "### Monthly update refresh"
            echo ""
            echo "- Static download links refreshed from the $(date -u +%Y-%m) WSUS catalog: ${ADDED} links added, ${REMOVED} retired links removed."
            echo ""
          } >> RELEASE_NOTES.md
          git add RELEASE_NOTES.md
          git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "docs(release): add ${VER} release notes"

      - name: Fetch runtime helpers
        run: bash ci/fetch-release-helpers.bash

      - name: Install frontend dependencies (npm ci for the Windows build)
        run: |
          cd src-modern/generator && npm ci && cd ../..
          cd src-modern/installer && npm ci && cd ../..

      - name: Build executables
        run: cmd //c ".\\CompileModernApps.cmd" --no-pause

      - name: Create release archive
        run: cmd //c ".\\MakeRelease.cmd" "${{ steps.version.outputs.version }}"

      - name: Verify release archive
        run: |
          VER="${{ steps.version.outputs.version }}"
          ZIP="$TEMP/wsusofflineCE${VER}.zip"
          [ -f "$ZIP" ] || { echo "FAIL: $ZIP absent"; exit 1; }
          if unzip -l "$ZIP" | grep -qE "wsusoffline/([.]|(pre|dead)[.]md|(ci|self-hosted)/)"; then
            echo "FAIL: entrées dev dans le zip"; unzip -l "$ZIP" | grep -E "wsusoffline/([.]|(pre|dead)[.]md|(ci|self-hosted)/)"; exit 1
          fi
          unzip -p "$ZIP" wsusoffline/client/bin/Autologon.exe > /dev/null || { echo "FAIL: client/bin/Autologon.exe manquant"; exit 1; }
          unzip -p "$ZIP" wsusoffline/client/bin/unzip.exe > /dev/null || { echo "FAIL: client/bin/unzip.exe manquant"; exit 1; }
          unzip -p "$ZIP" wsusoffline/client/cmd/DoUpdate.cmd | grep -q "WSUSOFFLINE_VERSION=${VER}" || { echo "FAIL: version ${VER} non embarquée"; exit 1; }
          echo "verify-release-archive: contenu OK"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          REL="WsusOfflineNext-${VER}"
          cp "$TEMP/wsusofflineCE${VER}.zip" "$TEMP/${REL}.zip"
          cp "$TEMP/wsusofflineCE${VER}_hashes.txt" "$TEMP/${REL}_hashes.txt"
          sed -n "/^## ${VER//./\\.}/,\$p" RELEASE_NOTES.md > "$TEMP/release-body.md"
          git tag "v${VER}"
          git push origin HEAD:main "v${VER}"
          gh release create "v${VER}" \
            --title "WSUS Offline Next ${VER}" \
            --notes-file "$TEMP/release-body.md" \
            "$TEMP/${REL}.zip" "$TEMP/${REL}_hashes.txt"
