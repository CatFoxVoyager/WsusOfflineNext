name: Monthly updates

# Monthly catalog refresh + release (design: docs/superpowers/specs/2026-10-28-ci-cd-dependencies-updates-design.md)
#
# SECURITY: the release job runs on the SELF-HOSTED Windows runner (the
# maintainer's machine); the catalog job runs on the self-hosted Docker Linux
# runner. Neither may ever execute for pull_request events, and only for this
# repository — the guards below are load-bearing, do not relax them.
# dry_run (workflow_dispatch only) forbids every push, tag and release.
# Since 27-01 dry_run also drives the RELEASE lane: the job runs through the
# batteries, the bump, the build, the zip gates and the FP-reputation gate,
# and the "no push, no tag, no release" guarantee still holds via the
# per-step DRY_RUN guards on exactly the two pushing steps. Local bump
# commits in a dry run are ephemeral runner-workspace state, never pushed.
# Scheduled runs pass no inputs, so dry_run defaults to false there.
# WR-03: the catalog job checks out main explicitly, so a workflow_dispatch
# from any ref refreshes and pushes main content only - never a feature branch.
# WR-04: no checkout persists credentials; the write token exists only as
# step-scoped env on the two push steps, and permissions are least-privilege
# (workflow defaults to contents read, only the two pushing jobs escalate).
# Residual: the job-scoped token transits one push command line - runner-PAT
# argv hygiene is Phase 16 CISH-04, a different secret.
#
# RUNNER MACHINE DEPENDENCIES (both runners are self-hosted, maintainer-owned)
# Catalog job (label wson-docker, Linux container): bash + GNU coreutils, git,
#   and node + npm for the Control build step; the Docker image itself provides
#   the cabextract/xml toolchain the catalog extraction needs.
# Release job (label wson-windows, Windows host - every step runs under Git
#   Bash): Git Bash (provides bash, unzip, sha256sum and the GNU coreutils the
#   steps and ci scripts call), 7-Zip (MakeRelease.cmd resolves
#   %ProgramFiles%\7-Zip\7z.exe, then %ProgramFiles(x86)%\7-Zip\7z.exe, then
#   7z.exe on PATH), gh (GitHub CLI, release publish step), node + npm (npm ci
#   before the builds), .NET 8 SDK (CompileModernApps.cmd drives dotnet
#   publish). ci/fetch-release-helpers.bash prefers the vendored bin/wget64.exe
#   and bin/unzip.exe, so no PATH wget/unzip is needed for it.

on:
  schedule:
    - cron: '0 6 15 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only: no push, no tag, no release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: wson-monthly
  cancel-in-progress: false

jobs:
  catalog:
    name: Catalog refresh (Docker Linux)
    runs-on: [self-hosted, wson-docker]
    timeout-minutes: 90
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.repository == 'CatFoxVoyager/WsusOfflineNext'
    outputs:
      fire: ${{ steps.decide.outputs.fire }}
      lists_changed: ${{ steps.decide.outputs.lists_changed }}
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download catalog and extract id/url pairs (Linux toolchain)
        run: bash ci/extract-catalog-linux.bash "$RUNNER_TEMP/catalog" --download

      - name: Validate static links (two-pass, cache persisted between runs)
        run: bash ci/validate-links.bash static "$RUNNER_TEMP/pre.md" "$RUNNER_TEMP/dead.md" --cache "$GITHUB_WORKSPACE/../wson-dead-cache.txt"

      - name: Regenerate static lists (real fusion unless dry run)
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            bash ci/regen-static-lists.bash "$RUNNER_TEMP/catalog" static "$RUNNER_TEMP/dead.md" --dry-run
          else
            bash ci/regen-static-lists.bash "$RUNNER_TEMP/catalog" static "$RUNNER_TEMP/dead.md"
            mv .regen-report.md "$RUNNER_TEMP/regen-report.md"
          fi

      - name: Upload regeneration report
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: regen-report
          path: ${{ runner.temp }}/regen-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Control build (stands in for CI on token commits)
        run: |
          cd src-modern/generator && npm ci && npm run build && cd ../..
          cd src-modern/installer && npm ci && npm run build && cd ../..

      - name: Decide
        id: decide
        run: |
          if git diff --quiet -- static/; then
            lists_changed=false
          else
            lists_changed=true
          fi
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "$last_tag" = "none" ]; then
            commits_since=1
          else
            commits_since="$(git rev-list --count "${last_tag}..HEAD")"
          fi
          fire=false
          if [ "$lists_changed" = true ] || [ "$commits_since" -gt 0 ]; then
            fire=true
          fi
          {
            echo "fire=$fire"
            echo "lists_changed=$lists_changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Monthly updates report"
            echo
            echo "- lists changed: $lists_changed"
            echo "- commits since $last_tag: $commits_since"
            echo "- release fired: $fire"
            echo "- dry run: $DRY_RUN"
            echo
            echo '### Link validation (before)'
            echo '```'
            cat "$RUNNER_TEMP/pre.md"
            echo '```'
            echo
            echo '### Regeneration report'
            echo '```'
            cat "$RUNNER_TEMP/regen-report.md" 2>/dev/null || echo "(dry run — no fusion applied)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "decide: lists_changed=$lists_changed fire=$fire commits_since=$commits_since dry_run=$DRY_RUN"

      - name: Commit refreshed lists
        if: steps.decide.outputs.lists_changed == 'true' && env.DRY_RUN != 'true'
        env:
          AUTH_TOKEN: ${{ github.token }}
        run: |
          git add static/
          git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "chore(static): refresh download links $(date -u +%Y-%m)"
          REPO_URL="https://x-access-token:${AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$REPO_URL" main
          git merge-base --is-ancestor FETCH_HEAD HEAD \
            || { echo "REFUS: main a avance pendant le run - push non fast-forward evite; relancer le train mensuel" >&2; exit 1; }
          git push "$REPO_URL" HEAD:main

      - name: Dry-run boundary (catalog)
        if: env.DRY_RUN == 'true'
        run: echo "DRY RUN — no commit was pushed."

  release:
    name: Build and release (Windows native)
    needs: catalog
    runs-on: [self-hosted, wson-windows]
    timeout-minutes: 90
    permissions:
      contents: write
    if: |
      needs.catalog.result == 'success' &&
      needs.catalog.outputs.fire == 'true' &&
      github.event_name != 'pull_request' &&
      github.repository == 'CatFoxVoyager/WsusOfflineNext'
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    defaults:
      run:
        # Explicit Git-bash path: on this self-hosted Windows runner a bare
        # `bash` resolves to system32 bash.exe (the WSL relay), whose default
        # distro is docker-desktop -- a minimal distro with no /bin/bash,
        # so every step died with "execvpe(/bin/bash) failed" (run 41665534094).
        # Pinning Git bash makes the job independent of the machine's WSL state.
        # 8.3 short path, forward slashes, NO spaces: the Actions executor
        # fails to parse a shell path containing spaces/backslashes with
        # "Second path fragment must not be a drive or UNC name" before the
        # step even starts (run 41700189978). C:\PROGRA~1 is the NTFS short
        # name of C:\Program Files (verified present on the runner machine).
        shell: C:/PROGRA~1/Git/bin/bash.exe {0}
    steps:
      - name: Checkout (includes the refreshed lists)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Force CRLF on Windows scripts (milestone v4.2): files whose blob is
      # LF-normalized AND whose stale working-tree copy is also LF are treated
      # as up-to-date by checkout (normalized contents match), so the
      # eol=crlf smudge never re-applies and cmd.exe misparses them
      # ("Option was unexpected" — the 6.0.0 zip defect). Delete + re-checkout
      # forces the smudge to run on every batch/script file.
      - name: Force CRLF smudge on Windows scripts
        run: |
          SCRIPTS="$(git ls-files '*.cmd' '*.bat' '*.vbs' | tr '\n' ' ')"
          echo "re-smudging CRLF on: $SCRIPTS"
          for f in $SCRIPTS; do rm -f "$f"; done
          git checkout -- $SCRIPTS
          # fail closed: any script still containing a bare LF aborts the train
          BARE_LF_FAIL=0
          for f in $SCRIPTS; do
            if grep -qIv $'\r$' "$f" 2>/dev/null && [ -s "$f" ]; then
              LAST_CHAR_NOCR=$(tail -c 1 "$f" | od -An -t x1 | grep -qv "0a" || true)
              if grep -q $'\n' "$f" && [ "$(grep -c $'\r$' "$f" 2>/dev/null)" != "$(grep -c '' "$f" 2>/dev/null)" ]; then
                echo "FAIL: $f is not fully CRLF-terminated after forced re-smudge"
                BARE_LF_FAIL=1
              fi
            fi
          done
          if [ "${BARE_LF_FAIL}" -eq 1 ]; then exit 1; fi
          echo "crlf-force: all Windows scripts re-smudged CRLF"

      - name: Comparator battery (windows)
        run: bash ci/tests/test-compare-versions.sh

      - name: WebView2 dependency battery
        run: bash ci/tests/test-bump-webview2-dep.sh

      - name: Download regeneration report
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@v8
        with:
          name: regen-report
          path: ${{ runner.temp }}

      # One-time migration (phase 19, decision D-01): the first SemVer release
      # is the first train that runs after this workflow lands — the monthly
      # cron (0 6 15 * *) or a manual workflow_dispatch by the operator. A
      # legacy CalVer last tag (vYYYY.MM.P) resolves to 5.0.0+<train month>:
      # the schema change IS the major bump. The month is always derived from
      # the train date; nothing in the repo hardcodes it.
      - name: Resolve next version
        id: version
        run: |
          source ci/lib-bump-version.bash
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          month="$(date -u +%Y.%m)"
          if [ "${last_tag}" = "none" ]; then
            # First-release-ever edge: resolve directly as the migration target.
            version_full="5.0.0+${month}"
          else
            log_text="$(git log --format=%s%n%b "${last_tag}..HEAD" 2>/dev/null || true)"
            version_full="$(next_full_version "${last_tag}" "${month}" "${log_text}")"
          fi
          version_core="$(strip_version_metadata "${version_full}")"
          # Bounded collision loop (T-19-02): the core-only tag is probed
          # exactly like the historical gate; a collision bumps PATCH only,
          # and the loop fails closed after 100 iterations instead of
          # spinning the runner or silently skipping a release.
          iterations=0
          while git rev-parse -q --verify "refs/tags/v${version_core}" >/dev/null; do
            iterations=$((iterations + 1))
            if [ "${iterations}" -gt 100 ]; then
              echo "FAIL: version-collision loop exceeded 100 iterations (v${version_core} always taken)" >&2
              exit 1
            fi
            version_full="$(bump_core "${version_core}" PATCH)+${month}"
            version_core="$(strip_version_metadata "${version_full}")"
          done
          {
            echo "version_full=${version_full}"
            echo "version_core=${version_core}"
          } >> "$GITHUB_OUTPUT"
          echo "version_full: ${version_full}"
          echo "version_core: ${version_core}"

      - name: Bump version
        run: |
          bash ci/bump-version.bash "${{ steps.version.outputs.version_full }}"
          git add $(bash ci/bump-version.bash --print-files)
          # Tolerate "nothing to commit" on re-dispatched dry-runs: a deleted
          # broken release leaves main already carrying the bump commit, so a
          # re-bump is an idempotent no-op and the gates still run on the
          # already-bumped tree. A real train always has changes to commit.
          if git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "chore(release): bump version to ${{ steps.version.outputs.version_full }}"; then
            echo "bump commit created"
          else
            echo "bump commit skipped (nothing to commit — version already at target)"
          fi

      # The SDK pin must never rot between trains (1.0.2792.45 stood for a
      # year). The bumper reads the NuGet flatcontainer index and rewrites
      # only the 4-part PackageReference in BOTH csproj — fail-closed on
      # divergence, unreachable index or downgrade; the app-version matrix
      # is a disjoint namespace. The conditional commit is load-bearing:
      # git commit without staged changes is non-zero and would fail the
      # train on the daily no-op path.
      - name: Bump WebView2 SDK dependency
        run: |
          WV2_VER="$(bash ci/bump-webview2-dep.bash)"
          git add $(bash ci/bump-webview2-dep.bash --print-files)
          if git diff --cached --quiet; then
            echo "WebView2 SDK already current (${WV2_VER})"
          else
            git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
              commit -m "chore(deps): bump WebView2 SDK to ${WV2_VER}"
          fi

      - name: Append release notes
        run: |
          VER_FULL="${{ steps.version.outputs.version_full }}"
          REPORT="${RUNNER_TEMP}/regen-report.md"
          if [ "$DRY_RUN" = "true" ]; then
            # Dry run: the catalog job uploads no report under dry_run (the
            # regen report dies with its work dir), so the refresh section
            # carries explicit zeros plus a dry-run marker line.
            ADDED="0"; REMOVED="0"
            {
              echo ""
              echo "## ${VER_FULL}"
              echo ""
              echo "**Status:** current release."
              echo ""
              echo "### Monthly update refresh"
              echo ""
              echo "- Static download links refreshed from the $(date -u +%Y-%m) WSUS catalog: ${ADDED} links added, ${REMOVED} retired links removed."
              echo "- DRY RUN: regeneration report not transferred; counters forced to 0."
              echo ""
            } >> RELEASE_NOTES.md
          else
            [ -s "${REPORT}" ] || { echo "FAIL: regeneration report absent (artifact transfer missing)"; exit 1; }
            ADDED="$(grep -oE '[0-9]+ added' "${REPORT}" | head -1 | cut -d' ' -f1)"
            REMOVED="$(grep -oE '[0-9]+ removed' "${REPORT}" | head -1 | cut -d' ' -f1)"
            ADDED="${ADDED:-0}"; REMOVED="${REMOVED:-0}"
            {
              echo ""
              echo "## ${VER_FULL}"
              echo ""
              echo "**Status:** current release."
              echo ""
              echo "### Monthly update refresh"
              echo ""
              echo "- Static download links refreshed from the $(date -u +%Y-%m) WSUS catalog: ${ADDED} links added, ${REMOVED} retired links removed."
              echo ""
            } >> RELEASE_NOTES.md
          fi
          # Extract this release's body for the publish step. The pattern runs
          # under -E with '.' and '+' each escaped once: GNU BRE treats a
          # backslashed plus as a quantifier, so the plain form matches nothing.
          VER_ESC="${VER_FULL//./\\.}"
          VER_ESC="${VER_ESC//+/\\+}"
          sed -n -E "/^## ${VER_ESC}/,\$p" RELEASE_NOTES.md > "$TEMP/release-body.md"
          [ -s "$TEMP/release-body.md" ] || { echo "FAIL: release-notes heading for ${VER_FULL} not found"; exit 1; }
          git add RELEASE_NOTES.md
          git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "docs(release): add ${VER_FULL} release notes"

      - name: Fetch runtime helpers
        run: bash ci/fetch-release-helpers.bash

      - name: Install frontend dependencies (npm ci for the Windows build)
        run: |
          cd src-modern/generator && npm ci && cd ../..
          cd src-modern/installer && npm ci && cd ../..

      - name: Build executables
        env:
          # Lane [3/3] override consumed by CompileModernApps.cmd; unset
          # falls through to the scratch default and fails closed with a
          # named error on a runner checkout.
          WO_LAZARUS_ROOT: ${{ vars.WO_LAZARUS_ROOT }}
        run: cmd //c ".\\CompileModernApps.cmd" --no-pause

      - name: Create release archive
        run: cmd //c ".\\MakeRelease.cmd" "${{ steps.version.outputs.version_core }}"

      - name: Verify release archive
        run: |
          VER_CORE="${{ steps.version.outputs.version_core }}"
          VER_FULL="${{ steps.version.outputs.version_full }}"
          ZIP="$TEMP/wsusofflineCE${VER_CORE}.zip"
          [ -f "$ZIP" ] || { echo "FAIL: $ZIP absent"; exit 1; }
          if unzip -l "$ZIP" | grep -qE "wsusoffline/([.]|(pre|dead)[.]md|(ci|self-hosted)/|UpdateProjectBranding[.](cmd|py)|CompileModernApps[.]cmd|MakeReleaseUnzipped[.]cmd|WINDOWS[.]md|doc/(RELEASING[.]md|coverage[.]txt|branding/|screenshots/))"; then
            echo "FAIL: dev entries in the zip"
            unzip -l "$ZIP" | grep -E "wsusoffline/([.]|(pre|dead)[.]md|(ci|self-hosted)/|UpdateProjectBranding[.](cmd|py)|CompileModernApps[.]cmd|MakeReleaseUnzipped[.]cmd|WINDOWS[.]md|doc/(RELEASING[.]md|coverage[.]txt|branding/|screenshots/))"
            exit 1
          fi
          unzip -p "$ZIP" wsusoffline/client/bin/Autologon.exe > /dev/null || { echo "FAIL: client/bin/Autologon.exe missing"; exit 1; }
          unzip -p "$ZIP" wsusoffline/client/bin/unzip.exe > /dev/null || { echo "FAIL: client/bin/unzip.exe missing"; exit 1; }
          unzip -p "$ZIP" wsusoffline/bin/odt/setup.exe > /dev/null || { echo "FAIL: bin/odt/setup.exe missing"; exit 1; }
          unzip -p "$ZIP" wsusoffline/client/cmd/DoUpdate.cmd | grep -qF "WSUSOFFLINE_VERSION=${VER_FULL}" || { echo "FAIL: version ${VER_FULL} not embedded"; exit 1; }
          unzip -p "$ZIP" wsusoffline/UpdateGenerator.cmd > /dev/null || { echo "FAIL: UpdateGenerator.cmd entry point missing from the zip"; exit 1; }
          unzip -p "$ZIP" wsusoffline/WsusOfflineUpdater.exe > /dev/null || { echo "FAIL: WsusOfflineUpdater.exe missing from the zip (self-update updater must ship)"; exit 1; }
          unzip -p "$ZIP" wsusoffline/client/UpdateInstaller.cmd > /dev/null || { echo "FAIL: client/UpdateInstaller.cmd entry point missing from the zip"; exit 1; }
          # CRLF gate (milestone v4.2): every shipped .cmd/.bat/.vbs must be CRLF-terminated.
          # cmd.exe misparses multi-line parenthesized blocks in LF-only files
          # ("Option was unexpected" — the 6.0.0 zip shipped DownloadUpdates.cmd LF-only
          # because the version bump's in-place sed stripped CR). For each shipped
          # script: every line must end with CR (lines counted == lines ending CR),
          # fail closed on any bare-LF line.
          CRLF_FAIL=0
          for ZENTRY in $(unzip -Z1 "$ZIP" | grep -E "wsusoffline/.*[.](cmd|bat|vbs)$"); do
            ALL_LINES=$(unzip -p "$ZIP" "$ZENTRY" | grep -c '' || true)
            CR_LINES=$(unzip -p "$ZIP" "$ZENTRY" | grep -c $'\r$' || true)
            if [ "${ALL_LINES}" -eq 0 ] || [ "${ALL_LINES}" -ne "${CR_LINES}" ]; then
              echo "FAIL: $ZENTRY is not fully CRLF-terminated (lines=${ALL_LINES}, CRLF-terminated=${CR_LINES}) — cmd.exe misparses LF-only batch files"
              CRLF_FAIL=1
            fi
          done
          if [ "${CRLF_FAIL}" -eq 1 ]; then
            exit 1
          fi
          echo "crlf-gate: all shipped .cmd/.bat/.vbs are CRLF-terminated"
          if unzip -l "$ZIP" | grep -qE "wsusoffline/(client/)?Update(Generator|Installer)Launcher[.]au3|wsusoffline/UpdateGenerator[.]au3|[.]au3$|Aut2[Ee]xe[.]exe|wsusoffline/CompileAutoItScripts[.]cmd|wsusoffline/Include/|wsusoffline/UpdateGenerator(Legacy)?[.]exe|wsusoffline/client/UpdateInstaller([.]orig)?[.]exe"; then
            echo "FAIL: retired AutoIt artifacts or stale legacy exes in the zip (any .au3 source, launcher sources, generator legacy exe, Aut2Exe pair, compile script, Include/ stdlib; stale root UpdateGenerator.exe / UpdateGeneratorLegacy.exe, stale client/UpdateInstaller.exe / UpdateInstaller.orig.exe)"
            unzip -l "$ZIP" | grep -E "wsusoffline/(client/)?Update(Generator|Installer)Launcher[.]au3|wsusoffline/UpdateGenerator[.]au3|[.]au3$|Aut2[Ee]xe[.]exe|wsusoffline/CompileAutoItScripts[.]cmd|wsusoffline/Include/|wsusoffline/UpdateGenerator(Legacy)?[.]exe|wsusoffline/client/UpdateInstaller([.]orig)?[.]exe"
            exit 1
          fi
          unzip -p "$ZIP" wsusoffline/client/UpdateInstallerLegacy.exe > /dev/null 2>&1 || { echo "FAIL: client/UpdateInstallerLegacy.exe missing from the zip (native installer GUI must ship)"; exit 1; }
          echo "verify-release-archive: content OK"

      - name: FP-reputation gate (VT scan + WDSI packet)
        run: |
          # Adjudicated FP policy (owner decision 2026-11-05, 27-01 Task 1
          # checkpoint): fail closed on ANY malicious verdict EXCEPT the
          # named allowlist - APEX bare nameless "Malicious" verdicts on
          # .NET single-file bundles, the documented baseline class (23-01:
          # Bkav 1/68 on the self-contained prototype; archived sha-named
          # verdicts 1b8bd158 / e470231e in the 27-01 rehearsal evidence).
          # Every verdict is archived per train; the WDSI packet is still
          # generated for every flagged binary (the owner submits it,
          # pre-creating Microsoft reputation - same channel as the FPC
          # packets). A red VT call fails closed too: a stalled release is
          # safer than an unscanned one (T-27-04).
          GATE_DIR="$RUNNER_TEMP/fp-gate"
          mkdir -p "$GATE_DIR/wdsi-packet/vt" "$GATE_DIR/wdsi-packet/i386" "$GATE_DIR/wdsi-packet/x64"
          python - "$GATE_DIR" <<'PY'
          import hashlib, json, os, sys, time, urllib.request, urllib.error
          from pathlib import Path

          ALLOWED = {"APEX": "Malicious"}
          EXES = [
              "UpdateGeneratorModern.exe",
              "client/UpdateInstallerModern.exe",
              "client/UpdateInstallerLegacy.exe",
              "client/UpdateInstallerLegacy64.exe",
              "WsusOfflineUpdater.exe",
          ]
          API = "https://www.virustotal.com/api/v3"
          BOUNDARY = "----wson-fp-gate"
          POLL_INTERVAL_S = 20
          MAX_POLLS = 30

          def api_get(url, key):
              req = urllib.request.Request(url, headers={"x-apikey": key})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read().decode("utf-8"))

          def upload(path, key):
              data = path.read_bytes()
              body = (
                  f"--{BOUNDARY}\r\n"
                  f'Content-Disposition: form-data; name="file"; filename="{path.name}"\r\n'
                  f"Content-Type: application/octet-stream\r\n\r\n"
              ).encode("utf-8") + data + f"\r\n--{BOUNDARY}--\r\n".encode("utf-8")
              req = urllib.request.Request(
                  f"{API}/files",
                  data=body,
                  headers={
                      "x-apikey": key,
                      "Content-Type": f"multipart/form-data; boundary={BOUNDARY}",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=900) as r:
                  return json.loads(r.read().decode("utf-8"))

          def main():
              gate_dir = Path(sys.argv[1])
              vt_dir = gate_dir / "wdsi-packet" / "vt"
              vt_dir.mkdir(parents=True, exist_ok=True)
              key = os.environ.get("VT_API_KEY", "")
              if not key:
                  print("FAIL: VT_API_KEY absent - the FP gate fails closed (a stalled release is safer than an unscanned one)")
                  return 1
              violations = []
              summary = []
              for exe in EXES:
                  path = Path(exe)
                  raw = path.read_bytes()
                  sha = hashlib.sha256(raw).hexdigest()
                  dest = vt_dir / f"{sha}.json"
                  if not (dest.exists() and dest.stat().st_size > 2):
                      resp = upload(path, key)
                      aid = resp["data"]["id"]
                      final = None
                      for _ in range(1, MAX_POLLS + 1):
                          time.sleep(POLL_INTERVAL_S)
                          try:
                              an = api_get(f"{API}/analyses/{aid}", key)
                          except urllib.error.HTTPError as e:
                              print(f"poll: HTTP {e.code}")
                              continue
                          if an["data"]["attributes"]["status"] == "completed":
                              final = an
                              break
                      if final is None:
                          print(f"FAIL: analysis for {path.name} did not complete within {MAX_POLLS} polls - fail closed")
                          return 1
                      final.setdefault("data", {}).setdefault("attributes", {})["permalink"] = f"https://www.virustotal.com/gui/file/{sha}"
                      dest.write_text(json.dumps(final, indent=2), encoding="utf-8")
                  verdict = json.loads(dest.read_text(encoding="utf-8"))
                  attrs = verdict["data"]["attributes"]
                  stats = attrs["stats"]
                  entry = {"exe": exe, "sha256": sha, "stats": stats, "flagged": [], "adjudicated": []}
                  for engine, res in (attrs.get("results") or {}).items():
                      if res.get("category") != "malicious":
                          continue
                      allowed = ALLOWED.get(engine)
                      result = (res.get("result") or "").strip()
                      if allowed is not None and result == allowed:
                          print(f"ADJUDICATED-ALLOWLIST: {path.name} {sha[:16]} engine={engine} bare verdict '{result}' - baseline class (23-01 Bkav 1/68 prototype precedent)")
                          entry["adjudicated"].append({"engine": engine, "result": result})
                      else:
                          violations.append(f"{path.name} ({sha[:16]}): engine={engine} result={result!r} - not on the adjudicated allowlist")
                          entry["flagged"].append({"engine": engine, "result": result})
                  summary.append(entry)
                  print(f"verdict: {path.name} sha={sha[:16]} malicious={stats.get('malicious')} suspicious={stats.get('suspicious')} undetected={stats.get('undetected')}")
              (gate_dir / "wdsi-packet" / "verdict-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
              if violations:
                  print("FAIL: FP gate fail-closed on disallowed malicious verdict(s):")
                  for v in violations:
                      print(f"  - {v}")
                  return 1
              print("FP gate: PASS (all malicious verdicts absent or on the adjudicated allowlist)")
              return 0

          sys.exit(main())
          PY
          POLICY_RC=$?
          if [ "$POLICY_RC" -ne 0 ]; then
            echo "FP gate: FAIL (see verdicts above)" >&2
            exit 1
          fi
          python - "$GATE_DIR" <<'PY2'
