      - name: Upload WDSI packet artifact
        uses: actions/upload-artifact@v7
        with:
          name: wdsi-packet
          path: ${{ runner.temp }}/fp-gate/wdsi-packet
          if-no-files-found: error
          retention-days: 7

      - name: Dry-run boundary (release)
        if: env.DRY_RUN == 'true'
        run: echo "DRY RUN - no tag, no release, no push."

      - name: Tag and publish release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_TOKEN: ${{ github.token }}
        run: |
          VER_FULL="${{ steps.version.outputs.version_full }}"
          VER_CORE="${{ steps.version.outputs.version_core }}"
          REL="WsusOfflineNext-${VER_CORE}"
          cp "$TEMP/wsusofflineCE${VER_CORE}.zip" "$TEMP/${REL}.zip"
          cp "$TEMP/wsusofflineCE${VER_CORE}_hashes.txt" "$TEMP/${REL}_hashes.txt"
          # -f: a re-published release (deleted broken zip, bump commit already
          # on main) re-tags and re-uploads over the existing ref/assets
          git tag -f "v${VER_CORE}"
          REPO_URL="https://x-access-token:${AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$REPO_URL" main
          git merge-base --is-ancestor FETCH_HEAD HEAD \
            || { echo "REFUS: main a avance pendant le run - push non fast-forward evite; relancer le train mensuel" >&2; exit 1; }
          git push --force "$REPO_URL" HEAD:main "v${VER_CORE}"
          if gh release view "v${VER_CORE}" >/dev/null 2>&1; then
            echo "release v${VER_CORE} exists - updating assets and notes (clobber)"
            gh release upload "v${VER_CORE}" --clobber "$TEMP/${REL}.zip" "$TEMP/${REL}_hashes.txt"
            gh release edit "v${VER_CORE}" \
              --title "WSUS Offline Next ${VER_FULL}" \
              --notes-file "$TEMP/release-body.md"
          else
            gh release create "v${VER_CORE}" \
              --title "WSUS Offline Next ${VER_FULL}" \
              --notes-file "$TEMP/release-body.md" \
              "$TEMP/${REL}.zip" "$TEMP/${REL}_hashes.txt"
          fi

      - name: Publish self-update channel
        if: env.DRY_RUN != 'true'
        env:
          AUTH_TOKEN: ${{ github.token }}
        run: |
          VER_FULL="${{ steps.version.outputs.version_full }}"
          VER_CORE="${{ steps.version.outputs.version_core }}"
          printf '%s,release\r\n' "${VER_FULL}" > static/SelfUpdateVersion-recent.txt
          {
            printf 'https://github.com/CatFoxVoyager/WsusOfflineNext/releases/download/v%s/WsusOfflineNext-%s.zip\r\n' "${VER_CORE}" "${VER_CORE}"
            printf 'https://github.com/CatFoxVoyager/WsusOfflineNext/releases/download/v%s/WsusOfflineNext-%s_hashes.txt\r\n' "${VER_CORE}" "${VER_CORE}"
          } > ci/StaticDownloadLink-recent.txt
          git add static/SelfUpdateVersion-recent.txt ci/StaticDownloadLink-recent.txt
          git -c user.name="wsusofflinenext-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "chore(release): publish self-update channel ${VER_FULL}"
          REPO_URL="https://x-access-token:${AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$REPO_URL" main
          git merge-base --is-ancestor FETCH_HEAD HEAD \
            || { echo "REFUS: main a avance pendant le run - push non fast-forward evite; relancer le train mensuel" >&2; exit 1; }
          git push "$REPO_URL" HEAD:main
